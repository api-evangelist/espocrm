aid: espocrm

name: EspoCRM

image: http://www.espocrm.com/images/free-crm-social.jpg

description: EspoCRM is an open-source Customer Relationship Management (CRM) platform that enables businesses to manage their sales, marketing,
  and customer support processes. It offers a flexible, customizable solution with features such as lead management, opportunity tracking, activity
  streams, and integration capabilities. EspoCRM provides a modern web interface, role-based access control, and extensible architecture through
  extensions and API access, allowing developers to build custom workflows and integrate with external services. The platform is designed for
  small to medium-sized enterprises seeking a cost-effective, self-hosted CRM solution.

